# Production docker-compose for cutai.org Postgres + Redis
# Run on the Contabo VPS:
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: cutai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cutai
    ports:
      - "5436:5432"
    volumes:
      - cutai_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cutai-redis
    ports:
      - "6383:6379"
    restart: unless-stopped

volumes:
  cutai_pgdata:
