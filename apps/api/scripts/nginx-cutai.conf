# cutai.org nginx config — full server block
# Deployed to /etc/nginx/sites-enabled/cutai.org

server {
    listen 80;
    server_name cutai.org www.cutai.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cutai.org www.cutai.org;

    ssl_certificate /etc/nginx/ssl/cutai.crt;
    ssl_certificate_key /etc/nginx/ssl/cutai.key;

    # Frontend static files
    root /opt/cutai.org/apps/web/dist;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Badge proxy
    location /badge/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
